name: vovremya

x-app-environment: &app-environment
  MEDICATION_ENVIRONMENT: production
  MEDICATION_DEBUG: "false"
  MEDICATION_LOG_LEVEL: INFO
  MEDICATION_DATABASE_URL: postgresql+asyncpg://medication:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/medication
  MEDICATION_REDIS_URL: redis://redis:6379/0

x-app-service: &app-service
  build: .
  env_file:
    - .env.production
  environment: *app-environment
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.production
    environment: *app-environment
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    <<: *app-service
    command: ["python", "-m", "medication_reminder.telegram"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reminder-worker:
    <<: *app-service
    command: ["python", "-m", "medication_reminder.reminders"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medication
      POSTGRES_USER: medication
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medication -d medication"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
