[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medication-reminder"
version = "0.1.0"
description = "Telegram medication and injection reminder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31,<4.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<7.0",
    "reportlab>=4.2,<5.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires MEDICATION_TEST_DATABASE_URL pointing to PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/medication_reminder/telegram/*.py" = ["RUF001"]
"src/medication_reminder/analytics/*.py" = ["RUF001"]
"src/medication_reminder/presentation/http/mini_app.py" = ["E501", "RUF001"]
"src/medication_reminder/reporting.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

